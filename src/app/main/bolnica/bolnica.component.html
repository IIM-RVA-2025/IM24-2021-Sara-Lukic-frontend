<mat-toolbar class="toolbar">
  <span class="toolbar-side"></span>

  <span class="toolbar-title">
    Bolnice
  </span>

  <span class="toolbar-side toolbar-side--right">
    <button mat-raised-button color="primary" (click)="dodajBolnicu()">
      <mat-icon>add</mat-icon>
      <span>Nova bolnica</span>
    </button>
  </span>
</mat-toolbar>

<div class="page-background">
  <div class="table-wrapper">
    <div class="table-card mat-elevation-z2">

      <table mat-table [dataSource]="dataSource" class="patients-table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let b">{{ b.id }}</td>
        </ng-container>

        <ng-container matColumnDef="naziv">
          <th mat-header-cell *matHeaderCellDef> Naziv </th>
          <td mat-cell *matCellDef="let b">{{ b.naziv }}</td>
        </ng-container>

        <ng-container matColumnDef="adresa">
          <th mat-header-cell *matHeaderCellDef> Adresa </th>
          <td mat-cell *matCellDef="let b">{{ b.adresa }}</td>
        </ng-container>

        <ng-container matColumnDef="budzet">
          <th mat-header-cell *matHeaderCellDef> Budžet </th>
          <td mat-cell *matCellDef="let b">{{ b.budzet }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">
            Akcije
          </th>
          <td mat-cell *matCellDef="let b" class="actions-cell">
            <button mat-icon-button color="primary" (click)="izmeniBolnicu(b)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="obrisiBolnicu(b.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

    </div>
  </div>
</div>
