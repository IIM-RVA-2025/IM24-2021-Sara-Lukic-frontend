<mat-toolbar class="toolbar">

  <span class="toolbar-side"></span>

  <span class="toolbar-title">
    Odeljenja
  </span>

  <span class="toolbar-side toolbar-side--right">
    <button mat-raised-button color="primary" (click)="dodajOdeljenje()">
      <mat-icon>add</mat-icon>
      <span>Novo odeljenje</span>
    </button>
  </span>
</mat-toolbar>

<div class="page-background">
  <div class="table-wrapper">
    <div class="table-card mat-elevation-z2">

      <table mat-table [dataSource]="dataSource" class="patients-table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let o">{{ o.id }}</td>
        </ng-container>

        <ng-container matColumnDef="naziv">
          <th mat-header-cell *matHeaderCellDef>Naziv</th>
          <td mat-cell *matCellDef="let o">{{ o.naziv }}</td>
        </ng-container>

        <ng-container matColumnDef="lokacija">
          <th mat-header-cell *matHeaderCellDef>Lokacija</th>
          <td mat-cell *matCellDef="let o">{{ o.lokacija }}</td>
        </ng-container>

        <ng-container matColumnDef="bolnica">
          <th mat-header-cell *matHeaderCellDef>Bolnica</th>
          <td mat-cell *matCellDef="let o">{{ o.bolnica?.naziv }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">Akcije</th>
          <td mat-cell *matCellDef="let o" class="actions-cell">
            <button mat-icon-button color="primary" (click)="izmeniOdeljenje(o)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="obrisiOdeljenje(o.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

    </div>
  </div>
</div>
