<mat-toolbar class="toolbar">
  <span class="toolbar-side"></span>

  <span class="toolbar-title">
    Pacijenti
  </span>

  <span class="toolbar-side toolbar-side--right">
    <button mat-raised-button color="primary" (click)="dodajPacijenta()">
      <mat-icon>add</mat-icon>
      <span>Novi pacijent</span>
    </button>
  </span>
</mat-toolbar>

<div class="page-background">
  <div class="table-wrapper">
    <div class="table-card mat-elevation-z2">

      <table mat-table [dataSource]="dataSource" class="patients-table">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let p">{{ p.id }}</td>
        </ng-container>

        <ng-container matColumnDef="ime">
          <th mat-header-cell *matHeaderCellDef> Ime </th>
          <td mat-cell *matCellDef="let p">{{ p.ime }}</td>
        </ng-container>

        <ng-container matColumnDef="prezime">
          <th mat-header-cell *matHeaderCellDef> Prezime </th>
          <td mat-cell *matCellDef="let p">{{ p.prezime }}</td>
        </ng-container>

        <ng-container matColumnDef="zdrOsiguranje">
          <th mat-header-cell *matHeaderCellDef> Osiguran </th>
          <td mat-cell *matCellDef="let p">
            <span [ngClass]="p.zdrOsiguranje ? 'pill pill--yes' : 'pill pill--no'">
              {{ p.zdrOsiguranje ? 'Da' : 'Ne' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="datumRodjenja">
          <th mat-header-cell *matHeaderCellDef> Datum rođenja </th>
          <td mat-cell *matCellDef="let p">{{ p.datumRodjenja }}</td>
        </ng-container>

        <ng-container matColumnDef="odeljenje">
          <th mat-header-cell *matHeaderCellDef> Odeljenje </th>
          <td mat-cell *matCellDef="let p">{{ p.odeljenje?.naziv }}</td>
        </ng-container>

        <ng-container matColumnDef="dijagnoza">
          <th mat-header-cell *matHeaderCellDef> Dijagnoza </th>
          <td mat-cell *matCellDef="let p">{{ p.dijagnoza?.naziv }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">Akcije</th>
          <td mat-cell *matCellDef="let p" class="actions-cell">
            <button mat-icon-button color="primary" (click)="izmeniPacijenta(p)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="obrisiPacijenta(p.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

    </div>
  </div>
</div>
