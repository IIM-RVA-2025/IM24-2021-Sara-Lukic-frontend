<h2 mat-dialog-title class="dialog-title">
  {{ naslov }}
</h2>

<mat-dialog-content class="dialog-content">

  <mat-form-field appearance="outline" class="dialog-field">
    <mat-label>Naziv</mat-label>
    <input matInput [(ngModel)]="bolnica.naziv" required>
    <mat-error *ngIf="!bolnica.naziv">Naziv je obavezan</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="dialog-field">
    <mat-label>Adresa</mat-label>
    <input matInput [(ngModel)]="bolnica.adresa" required>
    <mat-error *ngIf="!bolnica.adresa">Adresa je obavezna</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="dialog-field">
    <mat-label>Budžet</mat-label>
    <input matInput type="number" [(ngModel)]="bolnica.budzet" required>
    <mat-error *ngIf="!bolnica.budzet">Budžet je obavezan</mat-error>
  </mat-form-field>

</mat-dialog-content>

<div mat-dialog-actions class="dialog-actions">
  <button mat-button class="cancel-btn" (click)="zatvori()">Otkaži</button>

  <!-- Dugme je disabled dok nisu popunjena sva polja -->
  <button 
    mat-raised-button 
    color="primary" 
    class="save-btn"
    (click)="sacuvaj()"
    [disabled]="!bolnica.naziv || !bolnica.adresa || !bolnica.budzet"
  >
    Sačuvaj
  </button>
</div>
